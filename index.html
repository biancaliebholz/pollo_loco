<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>El Pollo Loco</title>
  <link rel="stylesheet" href="style.css" />

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/img_pollo_locco/img/ui-pics/favicon.PNG" />
</head>

<body>
  <!-- Rotate overlay -->
  <div class="overlayMobile">
    <div class="turnScreenBox" id="turnScreen">
      <img class="turnScreenIcon" src="./assets/img_pollo_locco/img/ui-pics/rotate.PNG" alt="Rotate device">
      <p>Please rotate</p>
    </div>
  </div>

  <h1>El Pollo Loco</h1>

  <div class="game-container">
    <!-- Loading -->
    <div id="loadingScreen" class="loader-container hide">
      <img
        src="./assets/img_pollo_locco/img/6_salsa_bottle/bottle_rotation/1_bottle_rotation.png"
        alt="Loading..."
        class="spinner"
      />
    </div>

    <!-- TOP RIGHT: Sound + Fullscreen -->
    <div id="topControls" class="btn-container-top">
      <div class="btn-flex-top">
        <!-- SOUND -->
        <label class="ui-btn ui-btn--icon volume" title="Sound">
          <input id="muteToggle" class="volume-input" type="checkbox" aria-label="Toggle sound">
          <span class="volume-icon">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M11 5 6 9H3v6h3l5 4V5Zm8.5 7a4.5 4.5 0 0 0-2.1-3.8l-1.1 1.7a2.5 2.5 0 0 1 0 4.2l1.1 1.7A4.5 4.5 0 0 0 19.5 12Zm-2.2 0a2.3 2.3 0 0 0-1.1-2l-1.1 1.7a.7.7 0 0 1 0 .6l1.1 1.7a2.3 2.3 0 0 0 1.1-2Z"/>
              <path class="mute-line" fill="currentColor" d="M3 4.3 4.3 3 21 19.7 19.7 21 3 4.3Z"/>
            </svg>
          </span>
        </label>

        <button
          id="pauseBtn"
          class="ui-btn ui-btn--icon d-none"
          type="button"
          onclick="togglePause()"
          aria-label="Pause"
          title="Pause"
        >
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/>
          </svg>
        </button>

        <!-- FULLSCREEN -->
        <button id="fullscreenBtn" class="ui-btn ui-btn--icon" type="button" onclick="toggleFullscreen()" aria-label="Fullscreen" title="Fullscreen">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M7 3H3v4h2V5h2V3Zm14 0h-4v2h2v2h2V3ZM5 17H3v4h4v-2H5v-2Zm16 0h-2v2h-2v2h4v-4Z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="startscreen-div">
      <div class="startscreen-img">
        <div class="startscreen-wrapper-img">
          <img src="assets/img_pollo_locco/img/9_intro_outro_screens/start/start.PNG" alt="start-screen" />
        </div>

        <!-- START BUTTON centered on image -->
        <div class="flex-container">
          <button class="ui-btn ui-btn--start" onclick="startGame()">Start Game</button>
        </div>

        <!-- BOTTOM: Imprint + Instructions -->
        <div class="btn-container-bottom">
          <a class="ui-btn ui-btn--pill" href="imprint.html" target="_blank" aria-label="Imprint" title="Imprint">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M10.2 3.5h3.9c2.8 0 4.9 2 4.9 4.7 0 2.1-1.2 3.8-3.2 4.4v7.3a1 1 0 1 1-2 0V13h-1.7v7.2a1 1 0 1 1-2 0V13c-2-.6-3.2-2.3-3.2-4.4 0-2.7 2.1-4.7 4.3-5.1Zm0 2c-1.4.3-2.3 1.5-2.3 3.1 0 1.9 1.2 3 3.3 3H14c2.1 0 3.3-1.1 3.3-3 0-1.8-1.3-3.1-3-3.1h-4.1Z"/>
            </svg>
            <span>Imprint</span>
          </a>

          <button class="ui-btn ui-btn--pill" type="button" onclick="popupToggleSecond()" aria-label="Instructions" title="How to play">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M6 4h10a2 2 0 0 1 2 2v13a1 1 0 0 1-1.5.86C14.9 18.9 13.5 18.5 12 18.5s-2.9.4-4.5 1.36A1 1 0 0 1 6 19V4Zm2 2v11.7c1.2-.6 2.5-.9 4-.9s2.8.3 4 .9V6H8Z"/>
            </svg>
            <span>How to play</span>
          </button>
        </div>

        <div id="popupIntroTextSecond" class="popup-intro-text">
          <div id="popupContentSecond" class="popup-content-second">

            <button class="howto-close" type="button" onclick="popupToggleSecond()">✕</button>

            <h3>Instruction</h3>

            <div class="instruction-popup">
              <div class="col-1">
                <div class="instruction-popup-item">
                  <span class="kbd-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 6 4 12l6 6v-4h10v-4H10V6Z"/></svg>
                  </span>
                  <span>Move Left</span>
                </div>

                <div class="instruction-popup-item">
                  <span class="kbd-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M14 6v4H4v4h10v4l6-6-6-6Z"/></svg>
                  </span>
                  <span>Move Right</span>
                </div>
              </div>

              <div class="col-1">
                <div class="instruction-popup-item">
                  <span class="kbd-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Zm2.2 4.5v9H12v-9h-1.8Zm4.8 0v9H16v-9h-1Z"/></svg>
                  </span>
                  <span>Attack (D)</span>
                </div>

                <div class="instruction-popup-item">
                  <span class="kbd-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 10h14a3 3 0 0 1 0 6H5a3 3 0 0 1 0-6Zm0 2a1 1 0 0 0 0 2h14a1 1 0 0 0 0-2H5Z"/></svg>
                  </span>
                  <span>Jump (Space)</span>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

    <!-- WIN -->
    <div id="winGameScreen" class="startscreen-div d-none">
      <div class="btn-container-restart">
        <button class="ui-btn ui-btn--restart" onclick="backToMenu()">Back to Menu</button>
        <button class="ui-btn ui-btn--restart" onclick="restartGame()">Restart</button>
        <img src="assets/img_pollo_locco/img/You won, you lost/You Win A.png" alt="winning-image" />
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen" class="startscreen-div d-none">
      <div class="btn-container-restart">
        <button class="ui-btn ui-btn--restart" onclick="backToMenu()">Back to Menu</button>
        <button class="ui-btn ui-btn--restart" onclick="restartGame()">Restart</button>
        <img src="assets/img_pollo_locco/img/You won, you lost/You lost.png" alt="losing-image" />
      </div>
    </div>

    <!-- CANVAS -->
    <canvas id="canvas" class="d-none" width="720" height="480"></canvas>

    <div id="pauseOverlay" class="pause-overlay d-none" onclick="togglePause()">
      <div class="pause-overlay-content">
        <div class="pause-icon">⏸</div>
        <div class="pause-text">Paused</div>
      </div>
    </div>

    <!-- MOBILE BUTTONS (SVG, gleiche Optik; erst nach Spielstart sichtbar via JS) -->
    <div id="btnMobileWrapper" class="btn-mobile-wrapper d-none">
      <div class="btn-mobile-flex">
        <button class="ui-btn ui-btn--touch" id="btnJump" type="button" aria-label="Jump">
          <svg class="ui-icon ui-icon--touch" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 4 4 12h5v8h6v-8h5L12 4Z"/>
          </svg>
        </button>

        <button class="ui-btn ui-btn--touch" id="btnThrow" type="button" aria-label="Throw">
          <svg class="ui-icon ui-icon--touch" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M13 2h-2v3l1 1v2.2l-3.6 3.6A4 4 0 0 0 7 14.6V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-5.4a4 4 0 0 0-1.4-2.8L12 8.2V6l1-1V2Zm2 12.6V20H9v-5.4c0-.6.2-1.2.7-1.6L12 10.7l2.3 2.3c.5.4.7 1 .7 1.6Z"/>
          </svg>
        </button>
      </div>

      <div class="btn-mobile-flex">
        <button class="ui-btn ui-btn--touch" id="btnLeft" type="button" aria-label="Left">
          <svg class="ui-icon ui-icon--touch" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M14 6 8 12l6 6v-4h8v-4h-8V6Z"/>
          </svg>
        </button>

        <button class="ui-btn ui-btn--touch" id="btnRight" type="button" aria-label="Right">
          <svg class="ui-icon ui-icon--touch" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M10 6v4H2v4h8v4l6-6-6-6Z"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script src="./models/drawable-object.class.js"></script>
  <script src="./models/movable-object.js"></script>
  <script src="./models/character.class.js"></script>
  <script src="./models/chicken.class.js"></script>
  <script src="./models/small-chicken.class.js"></script>
  <script src="./models/collectable-object.class.js"></script>
  <script src="./models/status-bar.class.js"></script>
  <script src="./models/cloud.class.js"></script>
  <script src="./models/background-layer.class.js"></script>
  <script src="./models/world.class.js"></script>
  <script src="./models/level.class.js"></script>
  <script src="./models/endboss.class.js"></script>
  <script src="./models/throwable-object.class.js"></script>
  <script src="./levels/level1.js"></script>
  <script src="./models/keyboard.class.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
